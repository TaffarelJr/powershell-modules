[changelog]
header = """# Changelog

All notable changes to this module are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this module adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | split(pat="/v") | last }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### \
{% if group == "Added" %}\U00002728 \
{% elif group == "Changed" %}\U0001F504 \
{% elif group == "Fixed" %}\U0001F41B \
{% elif group == "Removed" %}\U0001F5D1\uFE0F \
{% endif %}\
{{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}\U0001F4A5 **Breaking:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^(refactor|perf)", group = "Changed" },
  { message = "^revert", group = "Removed" },
  { message = "^(build|chore|ci|docs|infra|style|test)", skip = true },
]
