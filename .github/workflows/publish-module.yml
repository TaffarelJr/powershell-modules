# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Publishes a module from the release a person has just published.
#
# Nothing is rebuilt. The package the draft carried is downloaded, checked
# against the tag, and its attestation verified; it is then published to
# GitHub Packages and to the PowerShell Gallery, and the module's pages in the
# wiki are updated by update-wiki.yml. Publishing the release created the tag,
# which is what the next version is worked out from.
#
# A failed or partial run is started again from the Actions tab with the same
# tag: a version already on a feed is reported and left alone, and the wiki
# pages are rewritten whole. The wiki is a job of its own, run last, so a
# failure there makes the run red after both packages are published.

name: Publish Module

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, <Name>/vX.Y.Z, such as Tally/v0.2.0.
        type: string
        required: true

# Two publishes would race over the same package, so one runs at a time. GitHub
# keeps one pending run per group and replaces an older pending one: if three
# releases are published close together, the middle one is not published here,
# and is run again from the Actions tab with its tag.
concurrency:
  group: publish-module
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    name: Publish the package
    # Named, not ubuntu-latest: this needs PowerShell 7.6, and the image that
    # carries it is the one that was checked.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Read the release and its package
      packages: write # Push the package to this account's GitHub Packages feed
      attestations: read # Verify the attestation of the package
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ($env:TAG -notmatch '^[A-Za-z][A-Za-z0-9.]*/v\d+\.\d+\.\d+$') {
            Write-Host "::error::The tag '$env:TAG' is not <Name>/vX.Y.Z."
            exit 1
          }
          if ($env:PRERELEASE -eq 'true') {
            Write-Host '::error::A pre-release is not published by this workflow.'
            exit 1
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$env:TAG"

      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Download the package of the release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $r = ./build/Get-ReleasePackage.ps1 -Tag $env:TAG -Repository $env:REPOSITORY -Destination (Join-Path $env:RUNNER_TEMP package)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$($r.Path)"

      - name: Verify the attestation of the package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.package.outputs.path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh attestation verify $env:PACKAGE --repo $env:REPOSITORY --signer-workflow "$env:REPOSITORY/.github/workflows/draft-release.yml"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::The package has no valid attestation from the Draft Release workflow.'
            exit 1
          }

      # Whether the workflow's own token may create a NEW package on a
      # user-scoped feed is undocumented; PACKAGES_TOKEN, a classic token with
      # write:packages, is the fallback if it may not.
      - name: Publish to GitHub Packages
        env:
          PUBLISH_API_KEY: ${{ secrets.PACKAGES_TOKEN || github.token }}
          PACKAGE: ${{ steps.package.outputs.path }}
          OWNER: ${{ github.repository_owner }}
        run: |
          $r = ./build/Publish-ModulePackage.ps1 -Package $env:PACKAGE -Repository GitHubPackages -Uri "https://nuget.pkg.github.com/$env:OWNER/index.json"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "GitHub Packages: $($r.Id) $($r.Version) - published: $($r.Published), already there: $($r.Skipped)"

      - name: Publish to the PowerShell Gallery
        env:
          PUBLISH_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          $r = ./build/Publish-ModulePackage.ps1 -Package $env:PACKAGE -Repository PSGallery
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "PowerShell Gallery: $($r.Id) $($r.Version) - published: $($r.Published), already there: $($r.Skipped)"

  # A job that calls a workflow can set no runner, so the wiki is a job of its
  # own: it starts only once both feeds hold the package, and a failure in it
  # leaves the packages published. A called workflow can only keep or reduce
  # the permissions it is given, so they are named here.
  wiki:
    name: Update the wiki
    needs: publish
    permissions:
      contents: write # Read the release and its package, and push the wiki
      attestations: read # Verify the attestation of the package
    uses: ./.github/workflows/update-wiki.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
